# Configuration for GPT-3.5-turbo (paper's primary model)
# Reproduces the results in Table 2: HumanEval 86.6%, MBPP 79.2%
# Requires: export OPENAI_API_KEY=sk-...

backend: openai
model: gpt-3.5-turbo

# Inherit default hyperparameters
max_cot_prompts: 3
max_test_cases: 5
max_code_snippets: 3
max_repair_rounds: 3
code_timeout: 30
temperature_gen: 0.8
temperature_prune: 0.0
max_tokens: 2048
